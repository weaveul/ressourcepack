elfe_chaise:
  itemname: "<#9ad18a>Chaise sylvestre"
  material: PAPER
  lore:
    - "<gray>Style : <white>Elfe"
  components:
    item_model: evo:elfe_chaise
  mechanics:
    furniture:
      type: DISPLAY_ENTITY
      properties:
        display_transform: NONE
      barrier: true
      limited_placing:
        roof: false
        floor: true
        wall: false
      seats:
        - 0,-1.32,0
      drop:
        silktouch: false
